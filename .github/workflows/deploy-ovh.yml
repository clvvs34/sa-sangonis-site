name: Deploy OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site to OVH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Le mot de passe est le secret OVH_FTP_PASSWORD de l'environnement homonyme.
    environment: OVH_FTP_PASSWORD
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip when OVH_FTP_PASSWORD is empty
        id: gate
        env:
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OVH_FTP_PASSWORD}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "OVH_FTP_PASSWORD est vide : déploiement ignoré (succès, aucun envoi)."
            echo "::notice title=Déploiement ignoré::Le secret OVH_FTP_PASSWORD est vide. Aucun fichier n'est envoyé. Le job se termine avec succès."
            exit 0
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Upload to OVH
        if: steps.gate.outputs.skip != 'true'
        env:
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OVH_FTP_PASSWORD}" ]; then
            echo "OVH_FTP_PASSWORD est vide : déploiement ignoré (succès, aucun envoi)."
            echo "::notice title=Déploiement ignoré::Le secret OVH_FTP_PASSWORD est vide. Aucun fichier n'est envoyé. Le job se termine avec succès."
            exit 0
          fi

          export LFTP_PASSWORD="${OVH_FTP_PASSWORD}"
          export SSHPASS="${OVH_FTP_PASSWORD}"
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass lftp openssh-client

          host="ftp.cluster129.hosting.ovh.net"
          login="sasangw"

          # Retire le secret de toute sortie avant qu'elle n'atteigne le journal.
          # Lecture au fil de l'eau : un filtre qui attend la fin du flux bloque lftp en debug.
          cat > /tmp/redact-stream.py << 'PY'
          import os, sys
          pw = os.environ.get("LFTP_PASSWORD", "").encode()
          buf = b""
          while True:
              chunk = sys.stdin.buffer.read(4096)
              if not chunk:
                  break
              buf += chunk
              if pw and len(buf) > len(pw):
                  keep = len(pw) - 1
                  head, buf = buf[:-keep], buf[-keep:]
                  sys.stdout.buffer.write(head.replace(pw, b"***"))
                  sys.stdout.buffer.flush()
              elif not pw:
                  sys.stdout.buffer.write(buf)
                  sys.stdout.buffer.flush()
                  buf = b""
          if buf:
              if pw:
                  buf = buf.replace(pw, b"***")
              sys.stdout.buffer.write(buf)
              sys.stdout.buffer.flush()
          PY
          redact_stream() {
            python3 /tmp/redact-stream.py
          }

          batch="$(mktemp)"
          {
            echo "-mkdir www"
            find . -type d \
              -not -path '.' \
              -not -path './.git' -not -path './.git/*' \
              -not -path './.github' -not -path './.github/*' \
              -printf '%d %P\n' \
              | sort -n \
              | while read -r _depth rel; do
                  printf -- '-mkdir www/%s\n' "${rel}"
                done
            find . -type f \
              -not -path './.git/*' \
              -not -path './.github/*' \
              ! -name 'README.md' \
              -printf '%P\n' \
              | sort \
              | while read -r rel; do
                  printf 'put %s www/%s\n' "${rel}" "${rel}"
                done
            echo "ls -la www"
            echo "ls -la www/assets"
          } > "${batch}"

          echo "===== Étape 1 : OpenSSH sftp (batch, sshpass) ====="
          echo "----- batch.txt -----"
          cat "${batch}"
          set +e
          # sftp -b ajoute -oBatchMode=yes après les options. OpenSSH garde la
          # première valeur : -oBatchMode=no doit précéder, sinon le mot de passe
          # n'est jamais demandé et l'authentification échoue.
          timeout --kill-after=10s 120s \
            sshpass -e sftp \
              -oBatchMode=no \
              -oStrictHostKeyChecking=accept-new \
              -oPubkeyAuthentication=no \
              -oPreferredAuthentications=password,keyboard-interactive \
              -P 22 \
              -b "${batch}" \
              "${login}@${host}" 2>&1 | redact_stream
          step1_status="${PIPESTATUS[0]}"
          set -e
          echo "Code étape 1 : ${step1_status}"
          if [ "${step1_status}" -eq 0 ]; then
            echo "Protocole retenu : OpenSSH sftp batch"
            rm -f "${batch}"
            exit 0
          fi
          echo "Étape 1 échouée. Passage à lftp sftp."

          echo "===== Étape 2 : lftp sftp ====="
          lftp_script="$(cat <<EOF
          debug 3
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -oStrictHostKeyChecking=accept-new"
          set cmd:fail-exit yes
          set net:timeout 60
          set dns:max-retries 2
          set dns:order "inet inet6"
          set log:enabled/xfer no
          set bmk:save-passwords no
          set cmd:trace no
          open --env-password --user ${login} sftp://${host}:22
          pwd
          set cmd:fail-exit no
          mkdir -f -p www
          set cmd:fail-exit yes
          mirror -R --verbose --no-perms --no-umask --exclude-glob .git/ --exclude-glob .github/ --exclude README.md ./ www/
          set cmd:fail-exit no
          cls -la www
          cls -la www/assets
          bye
          EOF
          )"
          lftp_script="$(printf '%s\n' "${lftp_script}" | sed 's/^[[:space:]]*//')"
          set +e
          timeout --kill-after=15s 180s lftp -c "${lftp_script}" 2>&1 | redact_stream
          step2_status="${PIPESTATUS[0]}"
          set -e
          echo "Code étape 2 : ${step2_status}"
          if [ "${step2_status}" -eq 0 ]; then
            echo "Protocole retenu : lftp sftp"
            rm -f "${batch}"
            exit 0
          fi
          echo "Étape 2 échouée. Dernier recours : FTP explicite TLS (délai court)."

          echo "===== Étape 3 : FTP port 21, explicit TLS (dernier recours) ====="
          ftp_script="$(cat <<EOF
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          set ssl:check-hostname no
          set ftp:passive-mode yes
          set ftp:ignore-pasv-address yes
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set dns:max-retries 1
          set dns:order "inet inet6"
          set mirror:set-permissions no
          set ftp:use-site-chmod no
          set ftp:use-site-utime no
          set ftp:use-site-utime2 no
          set log:enabled/xfer no
          set bmk:save-passwords no
          set cmd:trace no
          open --env-password --user ${login} ftp://${host}:21
          pwd
          set cmd:fail-exit no
          mkdir -f -p www
          set cmd:fail-exit yes
          mirror -R --verbose --no-perms --no-umask --exclude-glob .git/ --exclude-glob .github/ --exclude README.md ./ www/
          set cmd:fail-exit no
          cls -la www
          cls -la www/assets
          bye
          EOF
          )"
          ftp_script="$(printf '%s\n' "${ftp_script}" | sed 's/^[[:space:]]*//')"
          set +e
          timeout --kill-after=10s 45s lftp -c "${ftp_script}" 2>&1 | redact_stream
          step3_status="${PIPESTATUS[0]}"
          set -e
          echo "Code étape 3 : ${step3_status}"
          rm -f "${batch}"
          if [ "${step3_status}" -ne 0 ]; then
            echo "Protocole retenu : aucun (les trois étapes ont échoué)."
            exit "${step3_status}"
          fi
          echo "Protocole retenu : FTP port 21 (explicit TLS)"

      - name: Verify public URLs
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          urls=(
            "https://sa-sangonis.fr"
            "http://sa-sangonis.fr"
            "https://www.sa-sangonis.fr"
            "https://sa-sangonis.fr/mentions-legales.html"
            "https://sa-sangonis.fr/assets/style.css"
            "https://sa-sangonis.fr/page-inexistante"
          )
          home_url="https://sa-sangonis.fr"
          http_url="http://sa-sangonis.fr"
          home_headers=""
          http_headers=""
          for url in "${urls[@]}"; do
            echo "===== ${url} ====="
            headers=""
            if [ "${url}" = "${home_url}" ] || [ "${url}" = "${http_url}" ]; then
              if ! headers="$(curl -sSI --max-time 30 --show-error "${url}")"; then
                echo "Impossible de lire les en-têtes de ${url}."
                exit 1
              fi
              if [ "${url}" = "${home_url}" ]; then
                home_headers="${headers}"
              else
                http_headers="${headers}"
              fi
            else
              headers="$(curl -sSI --max-time 30 --show-error "${url}" || true)"
            fi
            if [ -z "${headers}" ]; then
              echo "(pas de réponse)"
              continue
            fi
            if ! printf '%s\n' "${headers}" | grep -iE '^(HTTP/|Location:)'; then
              echo "(pas de ligne d'état ni d'en-tête Location)"
            fi
          done

          home_status="$(printf '%s\n' "${home_headers}" | awk 'toupper($1) ~ /^HTTP\// { code = $2 } END { print code }')"
          home_status="${home_status//$'\r'/}"
          if ! home_body="$(curl -sS --max-time 30 --show-error "${home_url}")"; then
            echo "Impossible de lire le corps de la page d'accueil."
            exit 1
          fi
          if [ "${home_status}" != "200" ]; then
            echo "La page d'accueil ${home_url} a répondu HTTP ${home_status:-<aucune>}, 200 attendu."
            exit 1
          fi
          if ! printf '%s' "${home_body}" | grep -q 'Sangonis'; then
            echo "Le corps de la page d'accueil ne contient pas « Sangonis »."
            exit 1
          fi
          echo "Contrôle page d'accueil : HTTP 200 et le corps contient Sangonis."

          http_status="$(printf '%s\n' "${http_headers}" | awk 'toupper($1) ~ /^HTTP\// { code = $2 } END { print code }')"
          http_status="${http_status//$'\r'/}"
          http_location="$(printf '%s\n' "${http_headers}" | awk 'BEGIN{IGNORECASE=1} /^Location:/ { print $2; exit }')"
          http_location="${http_location//$'\r'/}"
          echo "Contrôle HTTP : ${http_status} Location: ${http_location:-<aucune>}"
          case "${http_status}" in
            301|302|303|307|308) ;;
            *)
              echo "http://sa-sangonis.fr ne redirige pas vers HTTPS (code ${http_status:-<aucun>})."
              exit 1
              ;;
          esac
          case "${http_location}" in
            https://*) ;;
            *)
              echo "La redirection HTTP ne pointe pas vers https (Location: ${http_location:-<aucune>})."
              exit 1
              ;;
          esac
          echo "Contrôle redirection : HTTP redirige vers HTTPS."
